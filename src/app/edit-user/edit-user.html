<div class="container">
    <h2>Edit User</h2>

    <p *ngIf="loading">Loading user details...</p>

    <div *ngIf="!loading">
        <label>Name</label>
        <input [(ngModel)]="user.name" />

        <label>Email</label>
        <input [(ngModel)]="user.email" />

        <label>Phone</label>
        <input [(ngModel)]="user.phone" />

        <div class="buttons">
            <button class="btn-primary" (click)="updateUser()">Update</button>
            <button class="btn-cancel" (click)="cancel()">Cancel</button>
        </div>
    </div>
</div>
