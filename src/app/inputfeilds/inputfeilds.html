<h1>To-Do-List</h1>
<input type="text" [(ngModel)]="task" placeholder="Enter a task">
<button (click)="addTask()">Add Task</button>
<!-- <h1>{{task}}</h1> -->

@for(item of taskList; track item.id; let i = $index){
  <ul class="task-list">
    <li> {{item.id}}</li>

    <li>{{item.task}}</li> 
    <li> <button (click)="taskList.splice(i,1)">Delete</button></li>
    

  </ul>
   
}
